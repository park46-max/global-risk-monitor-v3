name: Update RSS news

# Official/publisher RSS feeds AND GDELT's open data files, each in its own step with its own cache file.
# SEPARATE from the GDELT search workflow (update-data.yml): nothing here can block or overwrite that data, and the reverse.
# A failure in one source here never stops the other: both steps run, both caches are committed, and the run only turns red
# when EVERY source that was tried failed.
#
# THE SCHEDULE IS OFF ON PURPOSE. Do these steps first (details in the README):
#   1. Run this workflow by hand with mode = verify. It requests each source once and writes nothing.
#   2. Read the results and each source's terms, then edit data/rss-sources.mjs for the RSS sources you accept.
#   3. Run it by hand with mode = fetch and check that it worked.
#   4. Only then remove the "# " in front of the two schedule lines below and commit.

on:
  # schedule:
  #   - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = check the sources, write nothing. fetch = update the caches.'
        type: choice
        default: verify
        options:
          - verify
          - fetch
      sources:
        description: 'Which sources to run'
        type: choice
        default: all
        options:
          - all
          - rss
          - gdelt-files

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Exit code 3 means "no RSS source is enabled yet": that is a warning, not a failure.
      - name: Official and publisher RSS feeds
        id: rss
        if: ${{ github.event.inputs.sources != 'gdelt-files' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          code=0
          node scripts/fetch-rss.mjs --${{ github.event.inputs.mode || 'fetch' }} || code=$?
          if [ "$code" = "3" ]; then
            echo "::warning::No RSS source is enabled yet (or none has feed addresses), so RSS was skipped. See the README."
            exit 0
          fi
          exit $code

      - name: GDELT open data files
        id: gk
        if: ${{ github.event.inputs.sources != 'rss' }}
        continue-on-error: true
        timeout-minutes: 12
        run: node scripts/fetch-gdelt-files.mjs --${{ github.event.inputs.mode || 'fetch' }}

      - name: Commit changed cache files
        id: commit
        if: ${{ github.event.inputs.mode != 'verify' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only the cache files that exist. If one of them was never written (for example RSS is switched off),
          # a single missing path makes "git add" refuse to stage ANY file, so each file is added on its own.
          for f in data/cache/news-rss.json data/cache/news-gdelt.json; do
            if [ -f "$f" ]; then git add "$f"; else echo "Not present, nothing to stage: $f"; fi
          done
          git status --short data/cache
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update news caches $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Best effort: asks GitHub to rebuild Pages after the commit. If it fails, the run continues.
      - name: Request a GitHub Pages build
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        continue-on-error: true
        run: GH_TOKEN="${{ github.token }}" gh api --method POST "/repos/${{ github.repository }}/pages/builds"

      - name: Fail the run only if every source failed
        if: ${{ steps.rss.outcome == 'failure' && steps.gk.outcome == 'failure' || steps.rss.outcome == 'failure' && steps.gk.outcome == 'skipped' || steps.rss.outcome == 'skipped' && steps.gk.outcome == 'failure' }}
        run: |
          echo "Every source that was tried failed. Cached data was kept and marked with the error. See the step logs and the run summary."
          exit 1
