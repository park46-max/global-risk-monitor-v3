name: Update RSS news

# Official/publisher RSS feeds AND GDELT's open data files, each in its own step with its own cache file.
# SEPARATE from the GDELT search workflow (update-data.yml): nothing here can block or overwrite that data, and the reverse.
# A failure in one source here never stops the other: both steps run, both caches are committed, and the run only turns red
# when EVERY source that was tried failed.
#
# SCHEDULE: every 3 hours (cron '23 */3 * * *', UTC). A scheduled run is exactly "mode = fetch, sources = all": see MODE and SOURCES below.
# Publisher RSS stays OFF: every publisher in data/rss-sources.mjs is enabled:false, so the RSS step ends with exit code 3 ("nothing enabled")
# and is reported as a warning. This workflow never enables a publisher; that is only done by editing data/rss-sources.mjs after reading the terms.
# By hand (Actions, Run workflow): mode = verify checks the sources and writes nothing, mode = fetch updates the caches.

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = check the sources, write nothing. fetch = update the caches.'
        type: choice
        default: verify
        options:
          - verify
          - fetch
      sources:
        description: 'Which sources to run'
        type: choice
        default: all
        options:
          - all
          - rss
          - gdelt-files
          - briefs

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # On a scheduled run github.event.inputs is empty, so these fall back to the scheduled behaviour. Every step below reads MODE and SOURCES
    # (never github.event.inputs directly), so a manual run and a scheduled run go through exactly the same conditions.
    env:
      MODE: ${{ github.event.inputs.mode || 'fetch' }}
      SOURCES: ${{ github.event.inputs.sources || 'all' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Exit code 3 means "no RSS source is enabled yet": that is a warning, not a failure.
      - name: Official and publisher RSS feeds
        id: rss
        if: ${{ env.SOURCES == 'all' || env.SOURCES == 'rss' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          code=0
          node scripts/fetch-rss.mjs --"$MODE" || code=$?
          if [ "$code" = "3" ]; then
            echo "::warning::No RSS source is enabled yet (or none has feed addresses), so RSS was skipped. See the README."
            echo "disabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $code

      - name: GDELT open data files
        id: gk
        if: ${{ env.SOURCES == 'all' || env.SOURCES == 'gdelt-files' }}
        continue-on-error: true
        timeout-minutes: 12
        run: node scripts/fetch-gdelt-files.mjs --"$MODE"

      # Country briefs are rebuilt from whatever news caches exist (also when a source above failed, because the earlier cached news is still valid input).
      # Rule-based, no network, no AI. If it fails, the previous briefs.json is kept and marked stale. A failure here is a warning, not a failed run.
      - name: Country briefs
        id: briefs
        continue-on-error: true
        timeout-minutes: 3
        run: |
          code=0
          node scripts/build-briefs.mjs --"$MODE" || code=$?
          if [ "$code" != "0" ]; then echo "::warning::Country briefs were not updated (see the log). Any earlier briefs.json is kept and shown as stale."; fi
          exit 0

      - name: Commit changed cache files
        id: commit
        if: ${{ env.MODE != 'verify' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only the cache files that exist. If one of them was never written (for example RSS is switched off),
          # a single missing path makes "git add" refuse to stage ANY file, so each file is added on its own.
          for f in data/cache/news-rss.json data/cache/news-gdelt.json data/cache/briefs.json; do
            if [ -f "$f" ]; then git add "$f"; else echo "Not present, nothing to stage: $f"; fi
          done
          git status --short data/cache
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update news caches $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Best effort: asks GitHub to rebuild Pages after the commit. If it fails, the run continues.
      - name: Request a GitHub Pages build
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        continue-on-error: true
        run: GH_TOKEN="${{ github.token }}" gh api --method POST "/repos/${{ github.repository }}/pages/builds"

      # "Tried" means actually run: an RSS step that ended with exit code 3 (nothing enabled) counts as NOT tried (steps.rss.outputs.disabled).
      # So with RSS switched off, a GDELT failure turns the run red; a green run therefore never hides a failed GDELT update.
# "!cancelled() &&" is a status-check function, so GitHub does NOT add its implicit success(): this step still runs when an earlier step
# (for example the commit step) has failed, but not when the run was cancelled by hand. The fetch steps use continue-on-error, so their failures
# do not fail the job by themselves; that is why this step is needed to turn a failed GDELT fetch into a red run.
      - name: Fail the run only if every source that was tried failed
        if: ${{ !cancelled() && ((steps.gk.outcome == 'failure' && (steps.rss.outcome != 'success' || steps.rss.outputs.disabled == 'true')) || (steps.rss.outcome == 'failure' && steps.gk.outcome == 'skipped')) }}
        run: |
          echo "Every source that was tried failed. Cached data was kept and marked with the error. See the step logs and the run summary."
          exit 1
