name: Update data cache

# Fetches news (GDELT) and indicators (World Bank) and commits them as JSON into data/cache/.
# Free: public repositories get free Actions minutes, and both APIs need no key.

on:
  schedule:
    # News: every 6 hours (UTC), at minute 17 to avoid the busy top of the hour.
    - cron: '17 */6 * * *'
    # Indicators: Mondays 04:43 UTC (World Bank data changes slowly).
    - cron: '43 4 * * 1'
  # Lets you run it by hand: repository > Actions > Update data cache > Run workflow.
  workflow_dispatch:
    inputs:
      dataset:
        description: 'What to fetch'
        type: choice
        default: all
        options:
          - all
          - news
          - indicators

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Choose what to fetch
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dataset=${{ github.event.inputs.dataset }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "43 4 * * 1" ]; then
            echo "dataset=indicators" >> "$GITHUB_OUTPUT"
          else
            echo "dataset=news" >> "$GITHUB_OUTPUT"
          fi

      - name: Check World Bank country codes
        if: ${{ steps.pick.outputs.dataset != 'news' }}
        continue-on-error: true
        run: node scripts/fetch-data.mjs --verify

      # continue-on-error so the error records still get committed; the last step fails the run if everything failed.
      - name: Fetch data
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-data.mjs --only=${{ steps.pick.outputs.dataset }}

      - name: Commit changed cache files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/news.json data/cache/indicators.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update data cache (${{ steps.pick.outputs.dataset }}) $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Best effort: asks GitHub to rebuild Pages after the commit. If it fails, the run continues.
      - name: Request a GitHub Pages build
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        continue-on-error: true
        run: GH_TOKEN="${{ github.token }}" gh api --method POST "/repos/${{ github.repository }}/pages/builds"

      - name: Fail the run if the fetch failed completely
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: |
          echo "Every request for at least one dataset failed. Cached files were kept and marked with the error. See the Fetch data step log."
          exit 1
